name: Delilah QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delilah-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check server-v5.js
      - run: node --check server-v6.js
      - run: node --check server-v7.js
      - run: node --check server-v8.js
      - run: node --check server-v9.js
      - run: node --check server-v10.js
      - run: node --check server-v11.js
      - run: node --check server-v12.js
      - run: node --check server-v13.js
      - run: node --check server-v14.js
      - run: node --check server-v15.js
      - run: node --check server-v16.js
      - run: node --check server-v17.js
      - run: node --check server-v18.js
      - run: node --check server-v19.js
      - run: node --check server-v20.js
      - run: node --check server-v21.js
      - run: node tests/regression.mjs

  deploy-ready:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for current production build
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.DELILAH_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let i=0;i<90;i++){
            try{
              const r=await fetch(`${base}/api/health`,{signal:AbortSignal.timeout(6000)});
              if(r.ok){const d=await r.json();last=JSON.stringify({edge:d.edge,progressiveSearch:d.progressiveSearch,indexedExactFallback:d.indexedExactFallback});if(d.edge==='inventory-v21'&&d.progressiveSearch===true&&d.indexedExactFallback===true){console.log('PASS deploy ready',last);process.exit(0)}}
            }catch(e){last=e.message}
            await sleep(2000);
          }
          throw new Error(`Production v21 not ready: ${last}`);
          NODE

  production-qa:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DELILAH_URL: https://delilah-pm5f.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public seller sources
        id: probe
        continue-on-error: true
        run: node tests/source-probe-v15.mjs
      - name: Test complete progressive UI wiring
        id: ui
        continue-on-error: true
        run: node tests/product-ui-v21.mjs
      - name: Test fast first results
        id: fast
        continue-on-error: true
        run: node tests/fast-path-v8.mjs
      - name: Test Arabic parsing and Syarah cash prices
        id: userpath
        continue-on-error: true
        run: node tests/user-path-v7.mjs
      - name: Test deterministic and indexed seller plugins
        id: plugins
        continue-on-error: true
        run: node tests/seller-plugins-v16.mjs
      - name: Test progressive accessible-market scan
        id: progressive
        continue-on-error: true
        run: node tests/progressive-market-v20.mjs
      - name: Test arbitrary model discovery
        id: arbitrary
        continue-on-error: true
        run: node tests/arbitrary-models-v21.mjs
      - name: Test Genesis certified inventory
        id: genesis
        continue-on-error: true
        run: node tests/genesis-wallan-v17.mjs
      - name: Test 200-car inventory scale
        id: scale
        continue-on-error: true
        run: node tests/inventory-scale.mjs
      - name: Run fast live smoke matrix
        id: smoke
        continue-on-error: true
        run: node tests/live-smoke.mjs
      - name: Fail if production QA has failures
        if: always()
        run: |
          echo "probe=${{ steps.probe.outcome }} ui=${{ steps.ui.outcome }} fast=${{ steps.fast.outcome }} userpath=${{ steps.userpath.outcome }} plugins=${{ steps.plugins.outcome }} progressive=${{ steps.progressive.outcome }} arbitrary=${{ steps.arbitrary.outcome }} genesis=${{ steps.genesis.outcome }} scale=${{ steps.scale.outcome }} smoke=${{ steps.smoke.outcome }}"
          test "${{ steps.probe.outcome }}" = success
          test "${{ steps.ui.outcome }}" = success
          test "${{ steps.fast.outcome }}" = success
          test "${{ steps.userpath.outcome }}" = success
          test "${{ steps.plugins.outcome }}" = success
          test "${{ steps.progressive.outcome }}" = success
          test "${{ steps.arbitrary.outcome }}" = success
          test "${{ steps.genesis.outcome }}" = success
          test "${{ steps.scale.outcome }}" = success
          test "${{ steps.smoke.outcome }}" = success
