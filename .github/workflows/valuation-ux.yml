name: Valuation and search UX
on:
  push:
    branches: [main, dalelah-release-candidate]
    paths: ['public/**', 'lib/*valuation*', 'server-core-candidate.js', 'scripts/valuation-ui-check.mjs', '.github/workflows/valuation-ux.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valuation-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/dalelah-browser --no-audit --no-fund playwright@1.55.0
          /tmp/dalelah-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify deployed release and responsive user journeys
        env:
          PLAYWRIGHT_MODULE: /tmp/dalelah-browser/node_modules/playwright/index.mjs
          EXPECTED_COMMIT: ${{ github.sha }}
          DALELAH_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://www.dalelah.co' || 'https://dalelah-release-candidate.onrender.com' }}
        run: node scripts/valuation-ui-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valuation-responsive-qa
          path: artifacts/valuation-ux/
