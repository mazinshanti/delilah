services:
  - type: web
    name: delilah-live-search
    runtime: node
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
