<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>كم تسوى سيارتك؟ — دليلة</title><meta name="description" content="اعرف القيمة التقديرية لسيارتك من أسعار سيارات مشابهة في السوق السعودي."><link rel="canonical" href="https://www.dalelah.co/car-valuation"><link rel="icon" href="/dalelah-icon.svg"><link rel="stylesheet" href="/experience.css"><link rel="stylesheet" href="/valuation.css?v=1"><script>try{const l=localStorage.getItem('dalelah.language')||'ar',t=localStorage.getItem('dalelah.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.documentElement.dataset.theme=t}catch{}</script></head><body>
<header class="nav wrap"><a class="brand" href="/" data-copy="brand">دليلة</a><nav class="navActions"><a href="/" data-copy="search">البحث</a><button id="language" class="text-button">English</button><button id="themeToggle" class="icon-button" aria-label="تغيير المظهر">◐</button></nav></header>
<main class="valuation-wrap"><nav class="sell-tabs" aria-label="خدمات السيارة"><a href="/car-valuation" aria-current="page" data-copy="valueTab">اعرف قيمة سيارتك</a><a href="/sell" data-copy="sellTab">بيع سيارتك</a></nav><header class="valuation-heading"><h1 data-copy="title">كم تسوى سيارتك؟</h1><p data-copy="intro">نعطيك تقديراً لقيمة سيارتك بناءً على أسعار السوق الحالية.</p></header>
<form id="valuationForm"><fieldset id="vehicleFields"><legend class="sr-only" data-copy="details">تفاصيل السيارة</legend><div class="valuation-fields">
<div class="field"><label for="make" data-copy="make">الماركة</label><select id="make" name="make" required></select></div><div class="field"><label for="model" data-copy="model">الموديل</label><select id="model" name="model" required disabled></select></div>
<div class="field"><label for="year" data-copy="year">سنة الصنع</label><input id="year" name="year" type="number" min="1900" max="2027" required inputmode="numeric"></div><div class="field"><label for="mileageKm" data-copy="mileage">الممشى (كم)</label><input id="mileageKm" name="mileageKm" type="number" min="0" max="3000000" required inputmode="numeric"></div><div class="field"><label for="city" data-copy="city">المدينة</label><select id="city" name="city" required></select></div>
</div><details class="valuation-optional"><summary data-copy="optional">تفاصيل إضافية (اختياري)</summary><div class="valuation-fields">
<div class="field"><label for="trim" data-copy="trim">الفئة</label><input id="trim" name="trim" maxlength="100" placeholder="GLX, Sport…"></div><div class="field"><label for="engine" data-copy="engine">المحرك</label><input id="engine" name="engine" maxlength="100"></div><div class="field"><label for="transmission" data-copy="transmission">ناقل الحركة</label><select id="transmission" name="transmission"></select></div><div class="field"><label for="driveType" data-copy="driveType">نظام الدفع</label><select id="driveType" name="driveType"></select></div><div class="field"><label for="exteriorColor" data-copy="color">اللون الخارجي</label><input id="exteriorColor" name="exteriorColor" maxlength="100"></div><div class="field"><label for="specification" data-copy="specification">المواصفات</label><select id="specification" name="specification"></select></div><div class="field"><label for="owners" data-copy="owners">عدد الملاك</label><input id="owners" name="owners" type="number" min="1" max="99" inputmode="numeric"></div><div class="field"><label for="accidentHistory" data-copy="accidentHistory">هل تعرضت لحادث؟</label><select id="accidentHistory" name="accidentHistory"></select></div><div class="field"><label for="serviceHistory" data-copy="serviceHistory">هل سجل الصيانة متوفر؟</label><select id="serviceHistory" name="serviceHistory"></select></div><div class="field"><label for="vehicleCondition" data-copy="condition">حالة السيارة</label><select id="vehicleCondition" name="vehicleCondition"></select></div>
</div></details></fieldset><button id="estimate" class="primary" type="submit" data-copy="estimate">اعرف قيمة سيارتي</button><p class="valuation-note" data-copy="basis">تقدير مبني على أسعار العرض، وليس ضماناً لسعر البيع.</p><p id="formError" role="alert"></p></form>
<div id="valuationLoading" hidden role="status" aria-live="polite"><span class="valuation-spinner" aria-hidden="true"></span><p id="loadingText"></p></div><section id="valuationResult" hidden aria-labelledby="resultTitle"></section>
</main><footer class="footer wrap"><a href="/" data-copy="brand">دليلة</a><span data-copy="footer">قرار أوضح، من أول خطوة.</span></footer><script type="module" src="/valuation.js?v=2"></script></body></html>
