name: Dalelah 1.5 QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dalelah-15-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax-check current Dalelah 1.5 search chain
        run: |
          node --check server-v15-saleh.js
          node --check server-v15-quality.js
          node --check server-v15-haraj.js
          node --check server-v15-market.js
          node --check server-recovery-v25.js
          node --check server-v24.js
          node --check server-v23.js
          node --check server-v22.js
          node --check server-v21.js
          node --check server-v20.js
          node --check lib/search-intent.js
          node --check tests/native-sources-v15.mjs
          node --check tests/saleh-native-v15.mjs
      - name: Test exact-year behavior
        run: npm run test:exact-year
      - name: Test current Dalelah 1.5 UI
        run: node --test tests/ui-v15.test.mjs
      - name: Run broad local regression assertions
        run: node tests/regression.mjs

  deploy-ready:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact Dalelah 1.5 commit to reach production
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.DELILAH_URL.replace(/\/$/,'');
          const expected=String(process.env.EXPECTED_GIT_COMMIT||'').trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let i=0;i<100;i++){
            try{
              const [home,health]=await Promise.all([
                fetch(`${base}/`,{signal:AbortSignal.timeout(7000),headers:{'cache-control':'no-cache'}}),
                fetch(`${base}/api/health`,{signal:AbortSignal.timeout(7000),headers:{'cache-control':'no-cache'}})
              ]);
              const html=await home.text();
              const h=await health.json().catch(()=>({}));
              const currentUi=html.includes('async function pollSearch')&&html.includes("seller:$('source').value");
              const exactCommit=Boolean(expected)&&String(h.renderGitCommit||'')===expected;
              const currentMarketEdge=h.motoryNativeCatalog===true&&h.harajNativeSearch===true&&h.syarahNativeInventory===true&&h.salehNativeInventory===true&&h.restartSafeSearchIds===true&&h.qualityGate===true;
              last=JSON.stringify({home:home.status,health:health.status,edge:h.edge||null,productVersion:h.productVersion||null,renderGitCommit:h.renderGitCommit||null,expected,currentUi,currentMarketEdge,exactCommit});
              if(home.ok&&health.ok&&currentUi&&currentMarketEdge&&h.productVersion==='1.5'&&h.edge==='dalelah-v15-saleh'&&exactCommit){console.log('PASS exact Dalelah 1.5 Saleh-native commit detected',last);process.exit(0)}
            }catch(e){last=e.message}
            await sleep(5000);
          }
          throw new Error(`Exact Dalelah 1.5 Saleh-native production commit not observed: ${last}`);
          NODE

  production-qa:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DELILAH_URL: https://delilah-pm5f.onrender.com
      EXPECTED_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact-year integrity and live market coverage
        run: node tests/production-v15-smoke.mjs
      - name: Verify source-native Syarah behavior
        run: node tests/native-sources-v15.mjs
      - name: Verify source-native Saleh Cars new inventory
        run: node tests/saleh-native-v15.mjs
