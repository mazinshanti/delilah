name: OpenSooq Coverage Probe

on:
  push:
    branches: [coverage/opensooq-v15]
    paths:
      - 'tests/probe-opensooq-v15.mjs'
      - '.github/workflows/opensooq-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe OpenSooq Saudi listing structure
        run: node tests/probe-opensooq-v15.mjs
