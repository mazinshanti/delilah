name: Dalelah Core Consolidation

on:
  push:
    branches:
      - dalelah-core-consolidation
  pull_request:
    branches:
      - main

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax
        run: npm run check
      - name: Direct core
        run: npm run test:direct-core
      - name: Existing exact-year
        run: npm run test:exact-year
      - name: Existing relevance
        run: npm run test:relevance
      - name: Marketplace foundation
        run: npm run test:marketplace
      - name: Arabic AI timeout and price safety
        run: node --test tests/ai-search-intent.test.mjs tests/arabic-ai-timeout-regression.test.mjs
      - name: Fast Arabic structured inventory search
        run: node --test tests/fast-arabic-inventory.test.mjs
      - name: Actual inventory snapshot Arabic latency
        run: node scripts/benchmark-fast-arabic-index.mjs
      - name: Authorized dealer feed ingestion safety
        run: node --test tests/authorized-dealer-feed.test.mjs
      - name: Authorized feed importer syntax
        run: node --check lib/authorized-feed.js && node --check scripts/import-authorized-dealer-feed.mjs
      - name: Market source freshness and coverage reporting
        run: node --test tests/inventory-coverage.test.mjs
      - name: Streaming inventory accuracy
        run: node --test tests/inventory-streaming.test.mjs
      - name: Frontend 512MB memory budget
        run: node --max-old-space-size=384 scripts/check-front-start-memory.mjs
      - name: Listing age and honest freshness labels
        run: node --test tests/listing-freshness-transparency.test.mjs
      - name: External search continuation safeguards
        run: node --test tests/source-search-links.test.mjs
      - name: On-demand live results and freshness-first regression
        run: node --test tests/live-source-completion.test.mjs tests/live-vehicle-buffer.test.mjs tests/source-sighting-integrity.test.mjs
      - name: Zero-copy fast indexed results with live merge
        run: node --test tests/mix-indexed-observed.test.mjs
      - name: Stable progressive search response memo
        run: node --test tests/search-response-memo.test.mjs
      - name: Verified indexed first-response fast path
        run: node --test tests/indexed-response-fast-path.test.mjs
      - name: Fresh-only source sightings and UI regressions
        run: node --test tests/recent-source-results.test.mjs
      - name: Builder visual editor integration
        run: node --test tests/builder-visual-editor.test.mjs
      - name: Current web UI
        run: node --test tests/ui-v15.test.mjs

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd mobile && npm install --no-audit --no-fund
      - name: Export iOS
        run: cd mobile && npx expo export --platform ios --output-dir dist-ios
      - name: Export Android
        run: cd mobile && npx expo export --platform android --output-dir dist-android
      - name: Export Web
        run: cd mobile && npx expo export --platform web --output-dir dist-web
