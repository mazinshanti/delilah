name: Delilah QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delilah-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check server-v24.js
      - run: node --check server-v25.js
      - run: node --check server-v26.js
      - run: node --check server-v27.js
      - run: node --check server-v30.js
      - run: node --check public/hotfix-v28.js
      - run: node --check tests/smart-search-v28.mjs
      - run: node --check tests/semantic-v25.mjs
      - run: node --check tests/universal-identity-v26.mjs
      - run: node tests/product-shell-v24.mjs
      - run: node tests/regression.mjs

  deploy-ready:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for stable smart-search production build
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.DELILAH_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='',observed=0;
          for(let i=0;i<110;i++){
            try{
              const r=await fetch(`${base}/api/health`,{signal:AbortSignal.timeout(7000)});
              if(r.ok){
                const d=await r.json();
                last=JSON.stringify({edge:d.edge,smartSearchBar:d.smartSearchBar,sourceAwareSearch:d.sourceAwareSearch,sourceBrowse:d.sourceBrowse,universalTypoCorrection:d.universalTypoCorrection,numericModelProtection:d.numericModelProtection,similarOfferings:d.similarOfferings,vehicleHistoryIntegration:d.vehicleHistoryIntegration});
                const ready=d.edge==='product-v30'&&d.smartSearchBar===true&&d.sourceAwareSearch===true&&d.sourceBrowse===true&&d.universalTypoCorrection===true&&d.numericModelProtection===true&&d.similarOfferings===true&&d.vehicleHistoryIntegration===true;
                if(ready){observed++;if(observed>=3){console.log('PASS stable v30 deploy',last);process.exit(0)}}else observed=0;
              }
            }catch(e){last=e.message;observed=0}
            await sleep(3000);
          }
          throw new Error(`Production v30 not ready: ${last}`);
          NODE

  production-qa:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DELILAH_URL: https://delilah-pm5f.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test smart search, source filters, typos, numeric models, similar and history
        run: node tests/smart-search-v28.mjs
      - name: Test universal manufacturer, model and localization identity
        run: node tests/universal-identity-v26.mjs
      - name: Test Compass exact identity and Syarah original prices
        run: node tests/semantic-v25.mjs
      - name: Test fast first results
        run: node tests/fast-path-v8.mjs
      - name: Test source-native seller plugins
        run: node tests/seller-plugins-v16.mjs
      - name: Test arbitrary model spelling discovery
        run: node tests/arbitrary-models-v21.mjs
      - name: Test 200-car inventory scale
        run: node tests/inventory-scale.mjs
