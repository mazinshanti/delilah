<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Dalelah Mobile Preview</title>
<style>
:root{--bg:#090a0b;--panel:#111316;--panel2:#171a1f;--line:#2a3037;--text:#f7f6f1;--muted:#9097a1;--accent:#d8ff5a;--ok:#aafc8b}*{box-sizing:border-box}body{margin:0;background:#050607;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.phone{max-width:430px;min-height:100vh;margin:0 auto;background:radial-gradient(circle at 80% -10%,rgba(216,255,90,.10),transparent 30%),var(--bg);padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;padding-top:max(8px,env(safe-area-inset-top))}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#090a0b;display:grid;place-items:center;font-weight:1000}.word{font-size:22px;font-weight:1000}.ar{font-size:11px;color:#8b929c}.live{font-size:10px;color:#b9bec5;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.hero{padding:34px 0 18px}.eyebrow{font-size:10px;color:var(--accent);font-weight:900;text-transform:uppercase;letter-spacing:1.1px}.hero h1{font-size:42px;line-height:.95;letter-spacing:-2px;margin:10px 0 12px}.hero h1 span{color:#757b83}.hero p{color:var(--muted);line-height:1.5;margin:0}.tabs{display:flex;background:#111316;border:1px solid var(--line);padding:4px;border-radius:14px;margin:16px 0 10px}.tab{flex:1;border:0;background:transparent;color:#8f959e;padding:12px;border-radius:10px;font-weight:900}.tab.active{background:var(--accent);color:#090a0b}.search{display:flex;gap:8px;background:#111316;border:1px solid #39404a;border-radius:20px;padding:7px}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:14px 10px;font-size:15px}.search button{border:0;background:var(--accent);color:#090a0b;border-radius:14px;padding:0 15px;font-weight:1000}.status{font-size:11px;color:var(--muted);margin:12px 2px 18px;min-height:16px}.status.error{color:#ff9d9d}.grid{display:grid;gap:12px}.card{background:#121519;border:1px solid #282e35;border-radius:18px;overflow:hidden}.photo{height:205px;background:#1a1e22;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.fallback{font-size:38px;color:#5f6670}.body{padding:14px}.source{font-size:9px;color:var(--accent);font-weight:900;text-transform:uppercase}.title{font-size:18px;font-weight:1000;margin-top:5px}.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.fact{font-size:9px;padding:6px 7px;background:#1c2025;border-radius:7px;color:#c9cdd3}.price{font-size:24px;font-weight:1000;margin-top:12px}.open{display:block;width:100%;border:1px solid #353b43;background:#1a1f24;color:white;border-radius:11px;padding:12px;margin-top:12px;font-weight:900}.empty{padding:36px 18px;border:1px dashed #30363e;border-radius:18px;color:#7f8791;text-align:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(10,11,12,.96);backdrop-filter:blur(15px);border-top:1px solid #242a30;padding:10px 12px max(10px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#8d949d;font-weight:900;font-size:11px;padding:8px}.nav button.active{color:var(--accent)}
</style>
</head>
<body>
<div class="phone">
  <div class="top"><div class="brand"><div class="mark">D</div><div><div class="word">Dalelah</div><div class="ar">دليلة</div></div></div><div class="live">Saudi market</div></div>
  <section class="hero"><div class="eyebrow">✦ Saudi automotive search</div><h1>Find the car.<br><span>We scan the market.</span></h1><p>Same Dalelah search engine, mobile experience.</p></section>
  <div class="tabs"><button id="used" class="tab active">Used</button><button id="new" class="tab">New</button></div>
  <div class="search"><input id="q" placeholder="Corolla 2013 or باترول 2020"/><button id="go">Search</button></div>
  <div id="status" class="status">Try a search to test the live connection.</div>
  <div id="grid" class="grid"><div class="empty">Live Dalelah listings will appear here.</div></div>
</div>
<div class="nav"><button class="active">Search</button><button onclick="location.href='/sell'">Sell</button><button>Saved</button></div>
<script>
let condition='used'; const q=document.getElementById('q'),grid=document.getElementById('grid'),statusEl=document.getElementById('status');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setCond(v){condition=v;document.getElementById('used').classList.toggle('active',v==='used');document.getElementById('new').classList.toggle('active',v==='new')}
document.getElementById('used').onclick=()=>setCond('used');document.getElementById('new').onclick=()=>setCond('new');
function render(cars){if(!cars.length){grid.innerHTML='<div class="empty">No matching cars yet.</div>';return;}grid.innerHTML=cars.slice(0,40).map(c=>{const img=c.image||c.imageUrl||c.images?.[0]||'';const price=Number(c.priceSar??c.price)||0;const mileage=Number(c.mileageKm??c.mileage)||0;return `<div class="card"><div class="photo">${img?`<img src="${esc(img)}" onerror="this.remove()">`:'<div class="fallback">🚘</div>'}</div><div class="body"><div class="source">${esc(c.source||'Dalelah')}</div><div class="title">${esc(c.title||[c.make,c.model,c.year].filter(Boolean).join(' ')||'Car')}</div><div class="facts">${c.year?`<span class="fact">${esc(c.year)}</span>`:''}${c.city?`<span class="fact">${esc(c.city)}</span>`:''}${mileage?`<span class="fact">${mileage.toLocaleString()} km</span>`:''}</div>${price?`<div class="price">SAR ${price.toLocaleString()}</div>`:''}${c.url?`<button class="open" onclick="window.open('${String(c.url).replace(/'/g,"%27")}','_blank')">View original listing</button>`:''}</div></div>`}).join('')}
async function search(){const query=q.value.trim();if(!query)return;statusEl.className='status';statusEl.textContent='Searching the Saudi market…';grid.innerHTML='<div class="empty">Scanning sources…</div>';try{const r=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,condition,filters:{}})});let data=await r.json();if(!r.ok)throw new Error(data.error||'Search failed');const by=new Map();const merge=x=>(Array.isArray(x)?x:[]).forEach(c=>{const k=c.url||c.originalUrl||c.id||Math.random();by.set(k,c)});merge(data.listings);render([...by.values()]);statusEl.textContent=`${by.size} cars found${data.complete?'':' · still scanning'}`;if(data.searchId){for(let i=0;i<10&&data.complete!==true;i++){await new Promise(x=>setTimeout(x,900));const p=await fetch('/api/search/progress/'+encodeURIComponent(data.searchId));if(!p.ok)break;data=await p.json();merge(data.listings);render([...by.values()]);statusEl.textContent=`${by.size} cars found${data.complete?'':' · still scanning'}`;}}}catch(e){statusEl.className='status error';statusEl.textContent='Connection error: '+(e.message||e);grid.innerHTML='<div class="empty">Dalelah could not load results. Try again.</div>';}}
document.getElementById('go').onclick=search;q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script>
</body></html>
