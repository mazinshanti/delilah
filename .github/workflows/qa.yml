name: Delilah QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delilah-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check server-v5.js
      - run: node --check server-v6.js
      - run: node --check server-v7.js
      - run: node --check server-v8.js
      - run: node --check server-v9.js
      - run: node --check server-v10.js
      - run: node --check server-v11.js
      - run: node --check server-v12.js
      - run: node --check server-v13.js
      - run: node --check server-v14.js
      - run: node --check server-v15.js
      - run: node --check server-v16.js
      - run: node --check server-v17.js
      - run: node --check server-v18.js
      - run: node tests/regression.mjs

  deploy-ready:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for current production build
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.DELILAH_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let i=0;i<90;i++){
            try{
              const r=await fetch(`${base}/api/health`,{signal:AbortSignal.timeout(8000)});
              if(r.ok){const d=await r.json();last=JSON.stringify({edge:d.edge,exhaustiveSearch:d.exhaustiveSearch});if(d.edge==='inventory-v18'&&d.exhaustiveSearch===true){console.log('PASS deploy ready',last);process.exit(0)}}
            }catch(e){last=e.message}
            await sleep(2000);
          }
          throw new Error(`Production v18 not ready: ${last}`);
          NODE

  source-probe-v15:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe seller source public HTML
        run: node tests/source-probe-v15.mjs

  fast-path-v9:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test first-results latency
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/fast-path-v8.mjs

  exhaustive-search-v18:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test exhaustive arbitrary-car search
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/exhaustive-search-v18.mjs

  seller-plugins-v16:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test strict seller plugins in production
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/seller-plugins-v16.mjs

  genesis-wallan-v17:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Genesis Wallan certified inventory plugin
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/genesis-wallan-v17.mjs

  catalog-breadth-v11:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test arbitrary cars from broad live catalog
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/catalog-breadth-v11.mjs

  extended-catalog-v14:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test expanded inventory beyond warm queries
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/extended-catalog-v14.mjs

  user-path-v7:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Arabic ألف and Syarah cash prices
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/user-path-v7.mjs

  live-smoke:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run controlled live-search smoke tests
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/live-smoke.mjs

  inventory-scale:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 200-car unique inventory scale test
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/inventory-scale.mjs
