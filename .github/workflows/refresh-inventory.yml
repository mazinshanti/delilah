name: Refresh public Saudi inventory
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inventory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/collect-market-inventory.mjs
        env:
          MARKET_PAGES: 500
          HARAJ_QUERIES: 200
          HARAJ_DETAILS: 2000
          HARAJ_DURATION_MS: 1500000
          ADDITIONAL_MARKET_PAGES: 250
          ADDITIONAL_MARKET_DETAILS: 2500
          ADDITIONAL_MARKET_SITEMAPS: 25
          ADDITIONAL_MARKET_DURATION_MS: 1800000
      - run: npm test
      - run: node --max-old-space-size=320 scripts/validate-market-inventory.mjs
      - run: node scripts/inventory-refresh-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-refresh-status
          path: audit/inventory-refresh-status.json
      - name: Save validated public inventory
        env:
          REFRESH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'Dalelah inventory refresh'
          git config user.email 'inventory@users.noreply.github.com'
          git add data/market-inventory.json.gz data/stock-crawl-state.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated Saudi inventory snapshot'
            git pull --rebase origin "$REFRESH_BRANCH"
            git push origin "HEAD:$REFRESH_BRANCH"
          fi
