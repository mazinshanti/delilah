name: Dalelah Core Consolidation

on:
  push:
    branches:
      - dalelah-core-consolidation
  pull_request:
    branches:
      - main

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax
        run: npm run check
      - name: Direct core
        run: npm run test:direct-core
      - name: Existing exact-year
        run: npm run test:exact-year
      - name: Existing relevance
        run: npm run test:relevance
      - name: Marketplace foundation
        run: npm run test:marketplace
      - name: Incremental inventory snapshot safety
        run: node --test tests/inventory-snapshot-merge.test.mjs tests/inventory-snapshot-cli.test.mjs
      - name: Source collection CLI syntax
        run: node --check scripts/collect-source-model.mjs && node --check scripts/merge-inventory-snapshot.mjs
      - name: Arabic AI intent and timeout safety
        run: node --test tests/ai-search-intent.test.mjs tests/arabic-ai-timeout-regression.test.mjs
      - name: Inventory and source coverage regression
        run: node --test tests/inventory-recall-search-intent.test.mjs tests/model-search-coverage.test.mjs tests/saudi-source-registry.test.mjs
      - name: Benchmark script syntax
        run: node --check scripts/market-search-performance-benchmark.mjs
      - name: Live multi-model performance and data quality (diagnostic)
        continue-on-error: true
        timeout-minutes: 8
        env:
          DALELAH_BENCHMARK_TIMEOUT_MS: '20000'
          DALELAH_BENCHMARK_POLLS: '3'
        run: node scripts/market-search-performance-benchmark.mjs
      - name: Current web UI
        run: node --test tests/ui-v15.test.mjs

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd mobile && npm install --no-audit --no-fund
      - name: Export iOS
        run: cd mobile && npx expo export --platform ios --output-dir dist-ios
      - name: Export Android
        run: cd mobile && npx expo export --platform android --output-dir dist-android
      - name: Export Web
        run: cd mobile && npx expo export --platform web --output-dir dist-web
