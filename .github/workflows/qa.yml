name: Delilah QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check server-v5.js
      - run: node --check server-v6.js
      - run: node --check server-v7.js
      - run: node --check server-v8.js
      - run: node tests/regression.mjs

  fast-path-v8:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Render auto-deploy
        run: sleep 75
      - name: Test first-results latency
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/fast-path-v8.mjs

  user-path-v7:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Render auto-deploy
        run: sleep 75
      - name: Test Arabic ألف and Syarah cash prices
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/user-path-v7.mjs

  live-smoke:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Render auto-deploy
        run: sleep 75
      - name: Run controlled live-search smoke tests
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/live-smoke.mjs

  inventory-scale:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait briefly for current production deploy
        run: sleep 45
      - name: Run 200-car unique inventory scale test
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: node tests/inventory-scale.mjs
