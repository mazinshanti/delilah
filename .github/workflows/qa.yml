name: Delilah QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delilah-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check server-v24.js
      - run: node --check server-v25.js
      - run: node --check server-v26.js
      - run: node --check server-v27.js
      - run: node --check tests/semantic-v25.mjs
      - run: node --check tests/universal-identity-v26.mjs
      - run: node tests/product-shell-v24.mjs
      - run: node tests/regression.mjs

  deploy-ready:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for stable universal production build
        env:
          DELILAH_URL: https://delilah-pm5f.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.DELILAH_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='',observed=0;
          for(let i=0;i<90;i++){
            try{
              const r=await fetch(`${base}/api/health`,{signal:AbortSignal.timeout(7000)});
              if(r.ok){
                const d=await r.json();
                last=JSON.stringify({edge:d.edge,universalVehicleIdentity:d.universalVehicleIdentity,unknownMakeFallback:d.unknownMakeFallback,queryExpansion:d.queryExpansion,identityNormalization:d.identityNormalization,exactModelIdentity:d.exactModelIdentity});
                const ready=d.edge==='product-v27'&&d.universalVehicleIdentity===true&&d.unknownMakeFallback===true&&d.queryExpansion===true&&d.identityNormalization===true&&d.exactModelIdentity===true;
                if(ready){observed++;if(observed>=3){console.log('PASS stable v27 deploy',last);process.exit(0)}}else observed=0;
              }
            }catch(e){last=e.message;observed=0}
            await sleep(3000);
          }
          throw new Error(`Production v27 not ready: ${last}`);
          NODE

  production-qa:
    needs: deploy-ready
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DELILAH_URL: https://delilah-pm5f.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test universal manufacturer, model and localization identity
        id: universal
        continue-on-error: true
        run: node tests/universal-identity-v26.mjs
      - name: Test Compass exact identity and Syarah original prices
        id: semantic
        continue-on-error: true
        run: node tests/semantic-v25.mjs
      - name: Test fast first results
        id: fast
        continue-on-error: true
        run: node tests/fast-path-v8.mjs
      - name: Test source-native seller plugins
        id: plugins
        continue-on-error: true
        run: node tests/seller-plugins-v16.mjs
      - name: Test arbitrary model spelling discovery
        id: arbitrary
        continue-on-error: true
        run: node tests/arbitrary-models-v21.mjs
      - name: Test 200-car inventory scale
        id: scale
        continue-on-error: true
        run: node tests/inventory-scale.mjs
      - name: Fail if universal production QA has failures
        if: always()
        run: |
          echo "universal=${{ steps.universal.outcome }} semantic=${{ steps.semantic.outcome }} fast=${{ steps.fast.outcome }} plugins=${{ steps.plugins.outcome }} arbitrary=${{ steps.arbitrary.outcome }} scale=${{ steps.scale.outcome }}"
          test "${{ steps.universal.outcome }}" = success
          test "${{ steps.semantic.outcome }}" = success
          test "${{ steps.fast.outcome }}" = success
          test "${{ steps.plugins.outcome }}" = success
          test "${{ steps.arbitrary.outcome }}" = success
          test "${{ steps.scale.outcome }}" = success
